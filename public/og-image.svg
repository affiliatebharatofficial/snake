<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2a231d" />
      <stop offset="100%" stop-color="#14110e" />
    </radialGradient>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffcf7" />
      <stop offset="100%" stop-color="#f7f2ea" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  {/* Background */}
  <rect width="1200" height="630" fill="url(#bg)" />

  {/* Ambient decorative lighting */}
  <circle cx="200" cy="150" r="300" fill="#d97706" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="350" fill="#2d6a4f" opacity="0.08" filter="blur(70px)" />

  {/* Left Section: Typography & Features */}
  <g transform="translate(80, 140)">
    {/* Badge */}
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#29221b" stroke="#523d2b" stroke-width="1.5" />
    <text x="24" y="24" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f59e0b">
      🎲 FREE ONLINE MULTIPLAYER
    </text>

    {/* Main Headline */}
    <text x="0" y="105" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Snake &amp; Ladder
    </text>
    <text x="0" y="165" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="#f59e0b" letter-spacing="-1">
      Online Board Game
    </text>

    {/* Subtitle */}
    <text x="0" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" fill="#d6c9ba">
      Roll the dice. Climb the ladders. Escape the snakes.
    </text>
    <text x="0" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400" fill="#a8998a">
      Play instantly with friends or AI bots • No signup required
    </text>

    {/* Features Chips */}
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#1c1814" stroke="#382f27" />
      <text x="20" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f5ebd9">⚡ Instant Play</text>

      <rect x="145" y="0" width="150" height="36" rx="8" fill="#1c1814" stroke="#382f27" />
      <text x="165" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f5ebd9">👥 Private Rooms</text>

      <rect x="310" y="0" width="130" height="36" rx="8" fill="#1c1814" stroke="#382f27" />
      <text x="330" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f5ebd9">📱 Mobile Ready</text>
    </g>
  </g>

  {/* Right Section: Illustrated Board & Dice Preview */}
  <g transform="translate(680, 80)" filter="url(#shadow)">
    {/* Wooden Board Frame */}
    <rect x="0" y="0" width="460" height="460" rx="24" fill="#2c1f16" stroke="#523b2b" stroke-width="4" />
    
    {/* Inner Playing Field */}
    <rect x="16" y="16" width="428" height="428" rx="12" fill="url(#boardBg)" stroke="#d6c4b2" stroke-width="2" />

    {/* Grid Lines Subtle */}
    <g stroke="#e8ded1" stroke-width="1">
      <line x1="16" y1="101" x2="444" y2="101" />
      <line x1="16" y1="186" x2="444" y2="186" />
      <line x1="16" y1="271" x2="444" y2="271" />
      <line x1="16" y1="356" x2="444" y2="356" />

      <line x1="101" y1="16" x2="101" y2="444" />
      <line x1="186" y1="16" x2="186" y2="444" />
      <line x1="271" y1="16" x2="271" y2="444" />
      <line x1="356" y1="16" x2="356" y2="444" />
    </g>

    {/* Illustrative Ladder */}
    <g stroke="#78350f" stroke-width="4" stroke-linecap="round">
      <line x1="120" y1="380" x2="210" y2="150" />
      <line x1="140" y1="388" x2="230" y2="158" />
    </g>
    <g stroke="#92400e" stroke-width="3" stroke-linecap="round">
      <line x1="123" y1="350" x2="143" y2="358" />
      <line x1="138" y1="310" x2="158" y2="318" />
      <line x1="153" y1="270" x2="173" y2="278" />
      <line x1="168" y1="230" x2="188" y2="238" />
      <line x1="183" y1="190" x2="203" y2="198" />
      <line x1="198" y1="150" x2="218" y2="158" />
    </g>

    {/* Illustrative Snake */}
    <path d="M 330 90 C 370 180, 240 250, 290 390" fill="none" stroke="#4a1515" stroke-width="8" stroke-linecap="round" />
    <path d="M 330 90 C 370 180, 240 250, 290 390" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    <circle cx="330" cy="90" r="9" fill="#b91c1c" stroke="#4a1515" stroke-width="2" />
    <circle cx="333" cy="88" r="2.5" fill="#fef08a" />
    <circle cx="333" cy="88" r="1.2" fill="#1a1a1a" />

    {/* Tokens on Board */}
    <circle cx="210" cy="140" r="14" fill="#2563eb" stroke="#1e40af" stroke-width="2" />
    <text x="206" y="145" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff">A</text>

    <circle cx="370" cy="310" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <text x="366" y="315" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff">R</text>

    {/* 3D Physical Ivory Dice Overlay */}
    <g transform="translate(300, 310)" filter="url(#shadow)">
      <rect x="0" y="0" width="90" height="90" rx="18" fill="#fffef9" stroke="#d6c4b2" stroke-width="3" />
      {/* 5 dots */}
      <circle cx="26" cy="26" r="6" fill="#1c1917" />
      <circle cx="64" cy="26" r="6" fill="#1c1917" />
      <circle cx="45" cy="45" r="7" fill="#dc2626" />
      <circle cx="26" cy="64" r="6" fill="#1c1917" />
      <circle cx="64" cy="64" r="6" fill="#1c1917" />
    </g>
  </g>
</svg>
